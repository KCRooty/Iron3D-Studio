name: CI

# AGENTS.md §5 / Documento Maestro §4.3: CI obligatoria, Windows + Linux con
# paridad total -- si una de las dos no compila, la build entera falla. Solo
# compila (no ejecuta Iron3DStudio.exe): el runner no tiene GPU real, y la
# regla del proyecto es sobre compilar, no sobre correr en el runner.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  windows:
    # windows-latest es el unico runner con winget disponible (windows-2022 no lo trae,
    # fallo real de esta sesion: "winget no reconocido"). El generador "Visual Studio 17
    # 2022" de CMake tambien fallo ahi ("could not find any instance of Visual Studio"),
    # asi que en vez de depender de esa deteccion se entra al entorno de MSVC a mano via
    # vswhere + vcvarsall.bat (patron estandar sin acciones de terceros) y se compila con
    # Ninja, igual que en Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vulkan SDK (winget)
        shell: pwsh
        run: |
          # --source winget evita que winget consulte la fuente msstore, que en un
          # runner nuevo pide aceptar un acuerdo interactivo y falla la instalacion entera.
          winget install --id KhronosGroup.VulkanSDK -e --source winget --accept-package-agreements --accept-source-agreements --silent
          $sdkRoot = Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$($sdkRoot.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Entorno MSVC (vswhere + vcvarsall x64)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd.exe /c "call `"$vsPath\VC\Auxiliary\Build\vcvarsall.bat`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Configurar (Ninja)
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar
        shell: pwsh
        run: cmake --build build --parallel

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Vulkan loader + glslang + X11 para GLFW)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev glslang-tools ninja-build \
            xorg-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev

      - name: Configurar (Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar
        run: cmake --build build --parallel
